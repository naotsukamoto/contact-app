name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true
          REACT_APP_FIREBASE_API_KEY: dummy
          REACT_APP_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
          REACT_APP_FIREBASE_PROJECT_ID: dummy-project
          REACT_APP_FIREBASE_STORAGE_BUCKET: dummy-project.appspot.com
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          REACT_APP_FIREBASE_APP_ID: "1:000000000000:web:dummy"
          REACT_APP_LIFF_ID: dummy-liff-id
